name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://radar:radar@localhost:55432/radar_test
      TEST_DATABASE_URL: postgres://radar:radar@localhost:55432/radar_test
      SEED_PASSWORD: ci-somente-sintetico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 scripts/economia.py > /dev/null
      - name: E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
