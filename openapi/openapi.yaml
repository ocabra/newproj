              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            name:
              type: string
            type:
              type: string
              enum:
                - manager
                - consumer
                - supplier
                - operator
            status:
              type: string
              enum:
                - pending
                - approved
                - rejected
                - suspended
            cnpj:
              type:
                - string
                - "null"
          required:
            - id
            - name
            - type
            - status
            - cnpj
      required:
        - user
        - role
        - via
        - scopes
        - organization
    SupplierInput:
