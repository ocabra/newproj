                name:
                  type: string
                email:
                  type: string
              required:
                - id
                - name
                - email
            - type: "null"
        role:
          type:
            - string
            - "null"
        via:
          type: string
          enum:
            - session
            - api_key
        scopes:
          anyOf:
            - type: array
              items:
                type: string
            - type: "null"
        organization:
          type: object
