# GERADO por scripts/gen-openapi.ts a partir de src/server/http/v1/schemas.ts — não editar à mão.
openapi: 3.1.0
info:
  title: Radar de Fornecedores — API B2B
  version: 1.0.0
  description: >-
    API B2B do protótipo **Radar de Fornecedores** (GO CONDICIONAL; dados
    sintéticos).


    Mostra eventos públicos de crédito de fornecedores de energia, curados com
    fonte, cruzados com os contratos da

    carteira da organização autenticada. **Não** é nota de crédito, não prevê
    falência, não tem relação oficial com

    CCEE, ANEEL ou Abraceel, e não negocia nem representa ninguém.


    Autenticação: `Authorization: Bearer rdf_<prefixo>_<segredo>` (chave gerada
    no portal, exibida uma única vez).

    Escopos: `portfolio:read`, `portfolio:write`, `alerts:read`, `alerts:write`.

    Paginação por cursor: `limit` (1–100) e `cursor` (opaco, devolvido em
    `next_cursor`).

    Idempotência: `POST /contracts` aceita o cabeçalho `Idempotency-Key`.

    Limite de taxa: 120 requisições/min por chave (`429` com `Retry-After`).
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: rdf_<prefixo>_<segredo>
  schemas:
    ErrorInput:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
