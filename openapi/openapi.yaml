                enum:
                  - judicial_recovery_filed
                  - bankruptcy_filed
                  - ccee_disconnection
                  - retailer_disqualification
                  - mcp_default_listed
                  - extrajudicial_recovery
                  - balanced_operation
                  - leverage_band_worsened
                  - protest_relevant
                  - leverage_band_improved
                  - governance_change
                  - other_public_notice
